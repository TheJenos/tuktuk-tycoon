# Fast checks with no emulator or browser: types, unit tests, the production build, and 100 bot-vs-bot
# games (every game ends, with the engine's invariants held after every move).
name: Checks

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - e2e/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - vitest.config.ts
      - .github/workflows/checks.yml
  pull_request:
    paths:
      - src/**
      - scripts/**
      - e2e/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - vitest.config.ts
      - .github/workflows/checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, unit tests, build and bot games
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run sim:bots -- --games 100
