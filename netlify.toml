[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Vite puts a content hash in asset file names, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The logo keeps its name when it changes, so it can't be cached forever. Use a day, then serve
# the cached copy while checking for a new one in the background.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The sounds keep their names too: a week, then the cached copy while checking for a new one.
[[headers]]
  for = "/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
